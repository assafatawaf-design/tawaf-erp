<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAWAF TRAVEL ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background-color: #0b1120; color: #f1f5f9; font-family: sans-serif; }
        .card-dark { background-color: #131c2e; border: 1px solid rgba(255, 255, 255, 0.08); }
        .gold-btn { background: #f59e0b; color: #000; font-weight: bold; }
    </style>
</head>
<body class="p-3 sm:p-6 pb-20">

    <!-- Тепа қисм -->
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
            <h1 class="text-xl font-bold text-amber-400">🕋 TAWAF TRAVEL ERP</h1>
            <p class="text-xs text-slate-400">Зиёратчиларни бошқариш тизими</p>
        </div>
        <div class="flex gap-2">
            <button type="button" onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg font-bold">
                <i class="fa-solid fa-file-excel mr-1"></i> Excel
            </button>
            <button type="button" onclick="openAddModal()" class="gold-btn text-xs px-4 py-2 rounded-lg shadow-lg">
                + Зиёратчи Қўшиш
            </button>
        </div>
    </div>

    <!-- Кўрсаткичлар (Статистика) -->
    <div class="max-w-6xl mx-auto grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
        <div class="card-dark p-3 rounded-xl text-center">
            <div class="text-xs text-slate-400">Жами Зиёратчи</div>
            <div id="statTotal" class="text-xl font-bold text-white mt-1">0</div>
        </div>
        <div class="card-dark p-3 rounded-xl text-center">
            <div class="text-xs text-slate-400">Визаси Тайёр</div>
            <div id="statVisa" class="text-xl font-bold text-blue-400 mt-1">0</div>
        </div>
        <div class="card-dark p-3 rounded-xl text-center">
            <div class="text-xs text-slate-400">Жами Тўлов</div>
            <div id="statPaid" class="text-xl font-bold text-emerald-400 mt-1">$0</div>
        </div>
        <div class="card-dark p-3 rounded-xl text-center">
            <div class="text-xs text-slate-400">Жами Қарз</div>
            <div id="statDebt" class="text-xl font-bold text-rose-400 mt-1">$0</div>
        </div>
    </div>

    <!-- Қидирув -->
    <div class="max-w-6xl mx-auto mb-4">
        <input type="text" id="searchInput" onkeyup="loadTable()" placeholder="Исм, Паспорт ёки Тел орқали қидириш..." 
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
    </div>

    <!-- Жадвал -->
    <div class="max-w-6xl mx-auto card-dark rounded-xl overflow-x-auto shadow-xl">
        <table class="w-full text-left text-xs border-collapse">
            <thead>
                <tr class="bg-slate-900 border-b border-slate-800 text-slate-400 text-[11px] uppercase">
                    <th class="p-3">Ф.И.Ш</th>
                    <th class="p-3">Паспорт</th>
                    <th class="p-3">Телефон</th>
                    <th class="p-3">Виза ҳолати</th>
                    <th class="p-3">Тўлов / Қарз</th>
                    <th class="p-3 text-center">Амаллар</th>
                </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-800">
                <!-- Сатрлар чиқади -->
            </tbody>
        </table>
        <div id="noDataText" class="p-8 text-center text-slate-500 text-xs hidden">
            Зиёратчилар топилмади. Сариқ «+ Зиёратчи Қўшиш» тугмасини босинг!
        </div>
    </div>

    <!-- Қўшиш ойнаси (Модал) -->
    <div id="modalBox" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-900 border border-slate-700 p-5 rounded-2xl w-full max-w-md space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="font-bold text-white text-sm" id="modalHeading">Зиёратчи Қўшиш</h3>
                <button type="button" onclick="closeAddModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>
            
            <input type="hidden" id="editIndex">

            <div>
                <label class="text-[11px] text-slate-400 block mb-1">Ф.И.Ш (Тўлиқ исми):</label>
                <input type="text" id="mName" placeholder="Алиев Вали" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">Паспорт рақами:</label>
                    <input type="text" id="mPassport" placeholder="AC1234567" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white uppercase">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">Телефон (WhatsApp):</label>
                    <input type="text" id="mPhone" placeholder="+996..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white">
                </div>
            </div>

            <div>
                <label class="text-[11px] text-slate-400 block mb-1">Виза ҳолати:</label>
                <select id="mVisa" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white">
                    <option value="Ҳужжат олинди">⏳ Ҳужжат олинди</option>
                    <option value="Масар юборилди">📤 Масар юборилди</option>
                    <option value="Виза тайёр">✅ Виза тайёр</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">Тўланган ($):</label>
                    <input type="number" id="mPaid" value="0" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-emerald-400 font-bold">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">Қарз ($):</label>
                    <input type="number" id="mDebt" value="0" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-rose-400 font-bold">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                <button type="button" onclick="closeAddModal()" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg text-xs">Бекор қилиш</button>
                <button type="button" onclick="savePilgrimData()" class="gold-btn px-4 py-1.5 rounded-lg text-xs">Сақлаш</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Қисми -->
    <script>
        let list = JSON.parse(localStorage.getItem('tawaf_list_db')) || [];

        function openAddModal() {
            document.getElementById('editIndex').value = '';
            document.getElementById('mName').value = '';
            document.getElementById('mPassport').value = '';
            document.getElementById('mPhone').value = '';
            document.getElementById('mVisa').value = 'Ҳужжат олинди';
            document.getElementById('mPaid').value = '0';
            document.getElementById('mDebt').value = '0';
            document.getElementById('modalHeading').innerText = 'Янги Зиёратчи Қўшиш';
            document.getElementById('modalBox').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('modalBox').classList.add('hidden');
        }

        function savePilgrimData() {
            const name = document.getElementById('mName').value.trim();
            const pass = document.getElementById('mPassport').value.trim();
            const phone = document.getElementById('mPhone').value.trim();
            const visa = document.getElementById('mVisa').value;
            const paid = document.getElementById('mPaid').value || 0;
            const debt = document.getElementById('mDebt').value || 0;
            const editIdx = document.getElementById('editIndex').value;

            if(!name) {
                alert('Илтимос, исм-шарифни киритинг!');
                return;
            }

            const item = { name, pass, phone, visa, paid: Number(paid), debt: Number(debt) };

            if(editIdx !== '') {
                list[editIdx] = item;
            } else {
                list.unshift(item);
            }

            localStorage.setItem('tawaf_list_db', JSON.stringify(list));
            closeAddModal();
            loadTable();
        }

        function deleteItem(index) {
            if(confirm('Ҳақиқатан ҳам ўчирмоқчимисиз?')) {
                list.splice(index, 1);
                localStorage.setItem('tawaf_list_db', JSON.stringify(list));
                loadTable();
            }
        }

        function editItem(index) {
            const p = list[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('mName').value = p.name;
            document.getElementById('mPassport').value = p.pass;
            document.getElementById('mPhone').value = p.phone;
            document.getElementById('mVisa').value = p.visa;
            document.getElementById('mPaid').value = p.paid;
            document.getElementById('mDebt').value = p.debt;
            document.getElementById('modalHeading').innerText = 'Маълумотни таҳрирлаш';
            document.getElementById('modalBox').classList.remove('hidden');
        }

        function sendWA(phone, name, paid, debt, visa) {
            if(!phone) { alert('Телефон рақам киритилмаган'); return; }
            const clean = phone.replace(/[^0-9]/g, '');
            const msg = encodeURIComponent(
                `Ассалому алайкум, ${name}!\n\n` +
                `"TAWAF TRAVEL" Умра сафари бўйича маълумотнома:\n` +
                `🛂 Виза ҳолати: ${visa}\n` +
                `💵 Тўланган: $${paid}\n` +
                `⚠️ Қолган қарз: $${debt}\n\n` +
                `Сафарингиз хайрли бўлсин!`
            );
            window.open(`https://wa.me/${clean}?text=${msg}`, '_blank');
        }

        function exportExcel() {
            if(list.length === 0) { alert('Рўйхатда ҳеч ким йўқ'); return; }
            const data = list.map((p, i) => ({
                "№": i + 1,
                "Ф.И.Ш": p.name,
                "Паспорт": p.pass,
                "Телефон": p.phone,
                "Виза ҳолати": p.visa,
                "Тўланган ($)": p.paid,
                "Қарз ($)": p.debt
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Зиёратчилар");
            XLSX.writeFile(wb, "Tawaf_Travel.xlsx");
        }

        function loadTable() {
            const tbody = document.getElementById('tableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            tbody.innerHTML = '';

            let totalPaid = 0;
            let totalDebt = 0;
            let totalVisa = 0;

            const filtered = list.filter((p, idx) => {
                totalPaid += p.paid;
                totalDebt += p.debt;
                if(p.visa === 'Виза тайёр') totalVisa++;

                return p.name.toLowerCase().includes(search) || 
                       p.pass.toLowerCase().includes(search) || 
                       p.phone.includes(search);
            });

            document.getElementById('statTotal').innerText = list.length;
            document.getElementById('statVisa').innerText = totalVisa;
            document.getElementById('statPaid').innerText = '$' + totalPaid.toLocaleString();
            document.getElementById('statDebt').innerText = '$' + totalDebt.toLocaleString();

            if(filtered.length === 0) {
                document.getElementById('noDataText').classList.remove('hidden');
                return;
            } else {
                document.getElementById('noDataText').classList.add('hidden');
            }

            filtered.forEach((p, idx) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40";
                tr.innerHTML = `
                    <td class="p-3 font-bold text-white">${p.name}</td>
                    <td class="p-3 text-amber-300 font-mono">${p.pass}</td>
                    <td class="p-3 text-slate-300">${p.phone}</td>
                    <td class="p-3">
                        <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${p.visa === 'Виза тайёр' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">
                            ${p.visa}
                        </span>
                    </td>
                    <td class="p-3">
                        <div class="text-emerald-400 font-bold">$${p.paid}</div>
                        ${p.debt > 0 ? `<div class="text-rose-400 text-[10px]">Қарз: $${p.debt}</div>` : ''}
                    </td>
                    <td class="p-3 text-center">
                        <div class="flex justify-center gap-1">
                            <button onclick="sendWA('${p.phone}', '${p.name}', '${p.paid}', '${p.debt}', '${p.visa}')" title="WhatsApp" class="p-1.5 bg-emerald-600 text-white rounded">
                                <i class="fa-brands fa-whatsapp"></i>
                            </button>
                            <button onclick="editItem(${idx})" title="Таҳрирлаш" class="p-1.5 bg-slate-800 text-amber-400 rounded">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteItem(${idx})" title="Ўчириш" class="p-1.5 bg-slate-800 text-rose-400 rounded">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Саҳифа очилиши билан ишга тушириш
        loadTable();
    </script>
</body>
</html>
