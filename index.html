<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAWAF ERP | Бошқарув Тизими</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1120">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { background-color: #0b1120; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .card-gold { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid rgba(245, 158, 11, 0.25); }
        .gold-gradient-text { background: linear-gradient(to right, #fbbf24, #d97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tab-active { background-color: #f59e0b; color: #020617; font-weight: 800; }
        .truncate-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-amber-500/20 px-3 py-2.5">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <svg class="w-8 h-8 shrink-0" viewBox="0 0 100 100" fill="none">
                    <circle cx="50" cy="50" r="46" stroke="#d97706" stroke-width="4"/>
                    <rect x="35" y="35" width="30" height="30" rx="4" transform="rotate(45 50 50)" fill="#0f172a" stroke="#f59e0b" stroke-width="3.5"/>
                    <rect x="40" y="40" width="20" height="20" rx="2" transform="rotate(45 50 50)" fill="#f59e0b"/>
                </svg>
                <div>
                    <h1 class="font-black text-xs sm:text-sm tracking-wider gold-gradient-text">TAWAF ERP</h1>
                    <p class="text-[8px] font-bold text-amber-500/80 uppercase">Бошқарув Пульти</p>
                </div>
            </div>
            <button type="button" onclick="window.location.href='app.html'" class="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-2.5 py-1 rounded-xl text-[11px] border border-amber-500/30">
                <i class="fa-solid fa-mobile-screen mr-1"></i> Зиёратчи
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-3 pt-3 space-y-3">

        <!-- Таблар -->
        <div class="grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 text-[11px]">
            <button type="button" onclick="switchAdminTab('pilgrims')" id="tabPilgrims" class="tab-active py-2 rounded-lg font-bold">
                <i class="fa-solid fa-users"></i> Зиёратчи
            </button>
            <button type="button" onclick="switchAdminTab('excursions')" id="tabExcursions" class="text-slate-400 py-2 rounded-lg font-bold">
                <i class="fa-solid fa-route"></i> Зиёратлар
            </button>
            <button type="button" onclick="switchAdminTab('hotels')" id="tabHotels" class="text-slate-400 py-2 rounded-lg font-bold">
                <i class="fa-solid fa-hotel"></i> Меҳмонхона
            </button>
        </div>

        <!-- 1: ЗИЁРАТЧИЛАР -->
        <div id="sectionPilgrims" class="space-y-3">
            <div class="grid grid-cols-3 gap-1.5 text-center">
                <div class="card-gold p-2 rounded-xl">
                    <div class="text-[9px] text-slate-400 font-bold">ЖАМИ</div>
                    <div id="statTotal" class="text-lg font-black text-amber-400">0</div>
                </div>
                <div class="card-gold p-2 rounded-xl">
                    <div class="text-[9px] text-slate-400 font-bold">ТЎЛАНГАН</div>
                    <div id="statPaid" class="text-lg font-black text-emerald-400">$0</div>
                </div>
                <div class="card-gold p-2 rounded-xl">
                    <div class="text-[9px] text-slate-400 font-bold">ҚАРЗ</div>
                    <div id="statDebt" class="text-lg font-black text-rose-400">$0</div>
                </div>
            </div>

            <div class="flex gap-2">
                <button type="button" onclick="openAddModal()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
                    <i class="fa-solid fa-user-plus"></i> Зиёратчи Қўшиш
                </button>
                <button type="button" onclick="exportToPDF()" class="bg-slate-800 text-slate-200 font-bold px-3 py-2.5 rounded-xl text-xs flex items-center gap-1 border border-slate-700">
                    <i class="fa-solid fa-file-pdf text-rose-400"></i> PDF
                </button>
            </div>

            <div class="space-y-2" id="pilgrimsList"></div>
        </div>

        <!-- 2: ЗИЁРАТЛАР / ЭКСКУРСИЯЛАР -->
        <div id="sectionExcursions" class="space-y-3 hidden">
            <div class="card-gold p-3 rounded-2xl space-y-2">
                <h3 class="text-xs font-bold text-amber-400"><i class="fa-solid fa-map-location-dot mr-1"></i> Янги Зиёрат қўшиш</h3>
                <input type="text" id="excTitle" placeholder="Зиёрат номи (Масалан: Савр тоғи)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white">
                <div class="grid grid-cols-2 gap-1.5">
                    <input type="text" id="excTime" placeholder="Вақти (Эртага 07:00)" class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white">
                    <input type="text" id="excBus" placeholder="Автобус (№07)" class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white">
                </div>
                <button type="button" onclick="saveExcursion()" class="w-full bg-amber-500 text-slate-950 font-black py-2 rounded-lg text-xs">
                    Эълон қилиш
                </button>
            </div>
            <div class="space-y-1.5" id="excursionsList"></div>
        </div>

        <!-- 3: МЕҲМОНХОНАЛАР -->
        <div id="sectionHotels" class="space-y-3 hidden">
            <div class="card-gold p-3 rounded-2xl space-y-2">
                <h3 class="text-xs font-bold text-amber-400"><i class="fa-solid fa-hotel mr-1"></i> Меҳмонхона қўшиш</h3>
                <input type="text" id="hotelName" placeholder="Меҳмонхона номи (Voco Makkah)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white">
                <div class="grid grid-cols-2 gap-1.5">
                    <select id="hotelCity" class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white">
                        <option value="Макка">Макка</option>
                        <option value="Мадина">Мадина</option>
                    </select>
                    <input type="text" id="hotelPhone" placeholder="Тел рақам" class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white">
                </div>
                <button type="button" onclick="saveHotel()" class="w-full bg-sky-600 text-white font-bold py-2 rounded-lg text-xs">
                    Сақлаш
                </button>
            </div>
            <div class="space-y-1.5" id="hotelsList"></div>
        </div>

    </main>

    <!-- МОДАЛ ОЙНА: ҚЎШИШ + OCR -->
    <div id="addModal" class="fixed inset-0 bg-black/95 z-50 p-4 hidden flex flex-col justify-between overflow-y-auto">
        <div class="max-w-md mx-auto w-full space-y-2.5">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="font-bold text-amber-400 text-xs">Янги Зиёратчи Қўшиш</h3>
                <button type="button" onclick="closeAddModal()" class="text-slate-400 text-xl">&times;</button>
            </div>

            <!-- OCR -->
            <div class="card-gold p-3 rounded-xl border-dashed border border-amber-500/40 text-center space-y-1.5">
                <div class="text-[11px] font-bold text-amber-300">📸 Паспорт / ID расмини юклаш (OCR):</div>
                <input type="file" id="passportFile" accept="image/*" class="hidden" onchange="processPassportOCR(event)">
                <button type="button" onclick="document.getElementById('passportFile').click()" class="bg-amber-500 text-slate-950 font-black px-3 py-1.5 rounded-lg text-xs shadow">
                    Галереядан танлаш
                </button>
                <div id="ocrLoader" class="hidden text-[11px] text-amber-400 animate-pulse">Аниқланмоқда...</div>
                <div id="ocrSuccess" class="hidden text-[11px] text-emerald-400 font-bold">Тайёр!</div>
            </div>

            <div class="space-y-2 text-xs">
                <div>
                    <label class="text-[10px] text-slate-400 block mb-0.5">Ф.И.Ш: *</label>
                    <input type="text" id="mName" placeholder="ABDULLOH ALIEV" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white uppercase">
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">Паспорт: *</label>
                        <input type="text" id="mPass" placeholder="AC1234567" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white uppercase font-mono">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">Телефон (WhatsApp): *</label>
                        <input type="text" id="mPhone" placeholder="+996..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white font-mono">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">Меҳмонхона:</label>
                        <select id="mHotel" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white"></select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">Тўланган ($):</label>
                        <input type="number" id="mPaid" value="1200" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-emerald-400 font-bold">
                    </div>
                </div>
            </div>

            <div class="pt-2 flex gap-2">
                <button type="button" onclick="savePilgrim()" class="flex-1 bg-amber-500 text-slate-950 font-black py-2.5 rounded-xl text-xs">
                    Сақлаш ва Бейджик Яратиш
                </button>
                <button type="button" onclick="closeAddModal()" class="bg-slate-800 text-slate-300 font-bold px-3 py-2.5 rounded-xl text-xs">
                    Ёпиш
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        let pilgrims = JSON.parse(localStorage.getItem('tawaf_pilgrims')) || [];
        let excursions = JSON.parse(localStorage.getItem('tawaf_excursions')) || [];
        let hotels = JSON.parse(localStorage.getItem('tawaf_hotels')) || [
            { name: "Voco Makkah Hotel", city: "Макка", phone: "+966123456789" },
            { name: "Pullman Zamzam Madinah", city: "Мадина", phone: "+966987654321" }
        ];

        function renderAll() {
            renderPilgrims();
            renderExcursions();
            renderHotels();
            updateStats();
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = pilgrims.length;
            const paid = pilgrims.reduce((s, p) => s + (Number(p.paid) || 0), 0);
            const debt = pilgrims.reduce((s, p) => s + (Number(p.debt) || 0), 0);
            document.getElementById('statPaid').innerText = "$" + paid;
            document.getElementById('statDebt').innerText = "$" + debt;
        }

        function renderPilgrims() {
            const list = document.getElementById('pilgrimsList');
            list.innerHTML = "";
            if (pilgrims.length === 0) {
                list.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">Ҳозирча зиёратчилар йўқ. Юқоридаги тугма орқали қўшинг.</div>`;
                return;
            }

            pilgrims.forEach((p, idx) => {
                const pilgrimAppUrl = `https://tawaf-erp.vercel.app/app.html?pass=${encodeURIComponent(p.id)}&name=${encodeURIComponent(p.name)}&group=${encodeURIComponent(p.group || 'Tawaf')}&hotel=${encodeURIComponent(p.hotel)}`;
                const waMessage = encodeURIComponent(`Ассалому алайкум, ҳурматли ${p.name}!\n\nСизнинг шахсий Tawaf Smart электрон бейджигингиз ва Умра дастурингиз тайёр бўлди:\n👉 ${pilgrimAppUrl}`);
                const cleanPhone = (p.phone || '').replace(/[^0-9]/g, '');

                const card = document.createElement('div');
                card.className = "card-gold p-2.5 rounded-xl flex items-center justify-between gap-2 shadow";
                card.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5">
                            <h4 class="font-bold text-white text-xs truncate-text uppercase">${p.name}</h4>
                            <span class="text-[9px] font-mono text-amber-400 bg-amber-500/10 px-1 py-0.5 rounded shrink-0">${p.id}</span>
                        </div>
                        <div class="text-[10px] text-slate-400 mt-0.5 truncate-text">
                            <span>${p.hotel}</span> | <span class="text-emerald-400 font-bold">$${p.paid}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <a href="https://wa.me/${cleanPhone}?text=${waMessage}" target="_blank" class="w-7 h-7 rounded-lg bg-emerald-600 text-white flex items-center justify-center text-xs shadow">
                            <i class="fa-brands fa-whatsapp"></i>
                        </a>
                        <button type="button" onclick="deletePilgrim(${idx})" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-400 hover:text-rose-400 flex items-center justify-center text-xs border border-slate-700">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        async function processPassportOCR(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('ocrLoader').classList.remove('hidden');
            document.getElementById('ocrSuccess').classList.add('hidden');

            const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const result = await Tesseract.recognize(evt.target.result, 'eng');
                    const text = result.data.text.toUpperCase();

                    const passRegex = /\b(ID|AN|AC|AB|FA|KA|AA)[\s-]?[0-9]{7}\b/i;
                    const passMatch = text.match(passRegex) || text.match(/[A-Z]{1,2}[0-9]{7}/i) || text.match(/\b[0-9]{9}\b/);
                    if (passMatch) {
                        document.getElementById('mPass').value = passMatch[0].replace(/[\s-]/g, '').toUpperCase();
                    }

                    const mrzMatch = text.match(/P<[A-Z]{3}([A-Z<]+)/i) || text.match(/I<[A-Z]{3}([A-Z<]+)/i);
                    if (mrzMatch) {
                        document.getElementById('mName').value = mrzMatch[1].replace(/<+/g, ' ').trim();
                    } else {
                        const lines = result.data.lines.map(l => l.text.trim()).filter(l => l.length > 3 && !l.includes("PASSPORT") && !l.includes("REPUBLIC"));
                        for (let line of lines) {
                            const words = line.split(/\s+/).filter(w => w.length > 2 && /^[A-Z]+$/.test(w));
                            if (words.length >= 2) {
                                document.getElementById('mName').value = words.slice(0, 3).join(' ');
                                break;
                            }
                        }
                    }
                    document.getElementById('ocrLoader').classList.add('hidden');
                    document.getElementById('ocrSuccess').classList.remove('hidden');
                } catch (err) {
                    document.getElementById('ocrLoader').classList.add('hidden');
                    alert("Хатолик: " + err);
                }
            };
            reader.readAsDataURL(file);
        }

        function savePilgrim() {
            const name = document.getElementById('mName').value.trim();
            const pass = document.getElementById('mPass').value.trim();
            const phone = document.getElementById('mPhone').value.trim();
            const hotel = document.getElementById('mHotel').value;
            const paid = document.getElementById('mPaid').value;

            if (!name || !pass) {
                alert("Исм ва Паспортни тўлдиринг!");
                return;
            }

            pilgrims.unshift({ id: pass, name, phone, hotel, paid, debt: 0, group: "Tawaf Travel" });
            localStorage.setItem('tawaf_pilgrims', JSON.stringify(pilgrims));
            renderAll();
            closeAddModal();
        }

        function deletePilgrim(idx) {
            if (confirm("Ўчиришни тасдиқлайсизми?")) {
                pilgrims.splice(idx, 1);
                localStorage.setItem('tawaf_pilgrims', JSON.stringify(pilgrims));
                renderAll();
            }
        }

        function saveExcursion() {
            const title = document.getElementById('excTitle').value.trim();
            const time = document.getElementById('excTime').value.trim();
            const bus = document.getElementById('excBus').value.trim();
            if (!title) return;
            excursions.unshift({ title, time, bus });
            localStorage.setItem('tawaf_excursions', JSON.stringify(excursions));
            renderExcursions();
            document.getElementById('excTitle').value = "";
            document.getElementById('excTime').value = "";
            document.getElementById('excBus').value = "";
        }

        function renderExcursions() {
            const list = document.getElementById('excursionsList');
            list.innerHTML = "";
            excursions.forEach((e, i) => {
                const item = document.createElement('div');
                item.className = "card-gold p-2 rounded-lg flex justify-between items-center text-xs";
                item.innerHTML = `<div><b class="text-amber-300">${e.title}</b> <span class="text-slate-400">(${e.time})</span></div>
                <button type="button" onclick="deleteExcursion(${i})" class="text-slate-500 hover:text-rose-400 p-1"><i class="fa-solid fa-trash"></i></button>`;
                list.appendChild(item);
            });
        }

        function deleteExcursion(i) {
            excursions.splice(i, 1);
            localStorage.setItem('tawaf_excursions', JSON.stringify(excursions));
            renderExcursions();
        }

        function saveHotel() {
            const name = document.getElementById('hotelName').value.trim();
            const city = document.getElementById('hotelCity').value;
            const phone = document.getElementById('hotelPhone').value.trim();
            if (!name) return;
            hotels.push({ name, city, phone });
            localStorage.setItem('tawaf_hotels', JSON.stringify(hotels));
            renderHotels();
            document.getElementById('hotelName').value = "";
            document.getElementById('hotelPhone').value = "";
        }

        function renderHotels() {
            const list = document.getElementById('hotelsList');
            const select = document.getElementById('mHotel');
            list.innerHTML = "";
            select.innerHTML = "";
            hotels.forEach(h => {
                const opt = document.createElement('option');
                opt.value = h.name;
                opt.innerText = `${h.city} - ${h.name}`;
                select.appendChild(opt);

                const item = document.createElement('div');
                item.className = "card-gold p-2 rounded-lg text-xs flex justify-between";
                item.innerHTML = `<span>${h.name} (${h.city})</span><span class="text-slate-400">${h.phone}</span>`;
                list.appendChild(item);
            });
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("TAWAF TRAVEL - Ro'yxat", 14, 15);
            doc.autoTable({
                head: [["#", "F.I.SH", "Pasport", "Telefon", "Mehmonxona"]],
                body: pilgrims.map((p, i) => [i + 1, p.name, p.id, p.phone, p.hotel]),
                startY: 20
            });
            doc.save("Ziyoratchilar.pdf");
        }

        function switchAdminTab(tab) {
            ['pilgrims', 'excursions', 'hotels'].forEach(t => {
                const sec = document.getElementById('section' + t.charAt(0).toUpperCase() + t.slice(1));
                const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
                if (t === tab) {
                    sec.classList.remove('hidden');
                    btn.className = "tab-active py-2 rounded-lg font-bold";
                } else {
                    sec.classList.add('hidden');
                    btn.className = "text-slate-400 py-2 rounded-lg font-bold";
                }
            });
        }

        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

        renderAll();
    </script>
</body>
</html>
